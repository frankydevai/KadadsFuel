<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI Assistant</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="assistant.html" data-title="AI Assistant" data-sub="Fleet-only answers with evidence from dashboard data"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div class="grid cols-2"><section class="card"><div class="eyebrow">Ask dispatch question</div><div id="answer" class="assistant-answer">Ask about a truck, load, fueling event, savings, or linked driver group.</div><div class="askbar"><input id="ask" placeholder="Example: did truck 2028 follow the fuel plan?"><button id="send" class="btn primary">Answer</button></div></section><section class="card"><h3>Suggested questions</h3><div id="prompts" class="quick-list"></div></section></div><div class="section-title"><h2>Evidence sources</h2><span>no outside data</span></div><div class="grid cols-4" id="sources"></div>`;
const qs=['Which trucks are low fuel?','Did truck 2028 follow the fuel plan?','Where did truck 3284 fuel?','How much money did we lose this month?'];
prompts.innerHTML=qs.map(q=>`<button class="btn" data-q="${DU.esc(q)}">${DU.esc(q)}</button>`).join('');
sources.innerHTML=['Samsara GPS','QuickManage loads','Fuel events','Contracted prices'].map(x=>`<div class="card"><div class="big lime">OK</div>${x}</div>`).join('');
async function respond(q){const [d,f,s]=await Promise.all([DU.req('/api/drivers'),DU.req('/api/fuel_events?limit=50'),DU.req('/api/savings?period=month')]);const m=q.match(/\d{3,}/);const unit=m&&m[0];let text=`Fleet saved ${DU.money2(s.verified_saved)} and lost ${DU.money2(s.lost)} this month.`;if(unit){const t=(d.drivers||[]).find(x=>String(x.unit_number)===unit);const ev=f.find(x=>String(x.truck_unit)===unit);text=t?`Truck ${unit}: ${Math.round(t.fuel_pct||0)}% fuel, ${Math.round(t.speed_mph||0)} mph, assigned stop ${t.stop_name||'none'}.`: `Truck ${unit} is not in current driver list.`;if(ev)text+=` Last fueling: ${ev.station_name||'unknown'} (${[ev.station_address,ev.station_city,ev.station_state].filter(Boolean).join(', ')||'no address'}), ${Number(ev.gallons||0).toFixed(0)} gal, ${ev.classification==='recommended'?'followed recommendation':'did not follow recommendation'}, price ${ev.your_price==null?'not matched':'$'+Number(ev.your_price).toFixed(3)+'/gal'}.`;}answer.textContent=text}
send.onclick=()=>respond(ask.value);prompts.onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;ask.value=b.dataset.q;respond(ask.value)};
</script></body></html>
