<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fleet Overview</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="index.html" data-title="Fleet Command" data-sub="What needs a human right now?"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<a class="move" href="/fuel-advice${PREVIEW?'?preview=1':''}"><b>Fuel Advice</b><span><strong>Visited, missed and fueling evidence</strong><small>Open automatic stop history and driver scores</small></span><i>Open →</i></a><div id="critical"></div><section style="text-align:center;padding:28px"><div class="eyebrow">Verified saved · this month</div><div class="hero-money" id="saved">$0</div><p class="muted">Only fuel-event backed dollars enter this headline.</p></section><div class="grid cols-4" id="proof"></div><div class="grid cols-3" id="exceptions" style="margin-top:14px"></div><div class="grid cols-2"><div><div class="section-title"><h2>Tonight's best moves</h2><span>capturable routes</span></div><div class="card" id="moves"></div></div><div><div class="section-title"><h2>Fleet pulse</h2><span>live</span></div><div class="card" id="pulse"></div></div></div>`;
async function load(){const [v,l,f]=await Promise.all([DU.req('/api/fleet/overview'),DU.req('/api/loads/pnl?period=month&limit=20'),DU.req('/api/fuel_events?limit=20')]);saved.textContent=DU.money2(v.saved_month);proof.innerHTML=`<div class="card"><div class="big lime">${v.verified_wins||0}</div><span class="muted">verified wins</span></div><div class="card"><div class="big">${v.avg_discount_cpg||0}¢</div><span class="muted">avg vs retail</span></div><div class="card"><div class="big">${v.total||0}</div><span class="muted">trucks tracked</span></div><div class="card"><div class="big lime">${f.length}</div><span class="muted">fuel proofs</span></div>`;exceptions.innerHTML=`<div class="card red"><div class="big red">${v.critical||0}</div>Critical fuel</div><div class="card amber"><div class="big amber">${DU.money2(v.recoverable)}</div>Recoverable</div><div class="card"><div class="big lime">${DU.money2(v.saved_month)}</div>Verified</div>`;critical.innerHTML=v.critical?`<div class="card red"><b>${v.critical} critical truck(s)</b> need dispatch attention before driver messages.</div>`:'';moves.innerHTML=(l.loads||[]).filter(x=>x.outcome==='pending'||x.recoverable>0).map(x=>`<a class="move" href="truck.html${PREVIEW?'?preview=1&id=':'?id='}${encodeURIComponent(x.truck_unit)}"><b>${DU.esc(x.truck_unit)}</b><span><strong>${DU.esc(x.station_name||'Fuel stop')}</strong><small>Load ${DU.esc(x.load_id)} · recoverable ${DU.money2(x.recoverable)}</small></span><i>Open</i></a>`).join('')||'<div class="empty">No open fuel moves.</div>';pulse.innerHTML=`<h3>Fuel health</h3><p>Healthy ${Math.max(0,v.total-v.low-v.critical-v.paused)} · Low ${v.low} · Critical ${v.critical} · Paused ${v.paused}</p><p class="muted">Fuel map and route map are ready for dispatch review.</p>`}
poll(load,10000);
</script></body></html>
