<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Integrations</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="integrations.html" data-title="Integrations" data-sub="Connection status for dispatch-critical systems"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div class="grid cols-4" id="cards"></div><div class="section-title"><h2>Identity map</h2><span>truck to GPS to Telegram</span></div><div class="card"><table><thead><tr><th>Unit</th><th>Driver</th><th>Samsara</th><th>Telegram group</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>`;
async function load(){const [h,c,d]=await Promise.all([DU.req('/health'),DU.req('/circuits'),DU.req('/api/drivers')]);cards.innerHTML=[['Samsara',c.samsara?.state||h.detail?.samsara],['QuickManage',h.detail?.quickmanage||'ok'],['Telegram',c.telegram?.state||h.detail?.telegram],['Routing',h.detail?.routing||'ok']].map(x=>`<div class="card"><div class="eyebrow">${DU.esc(x[0])}</div><div class="big lime">${DU.esc(x[1]||'ok')}</div><p class="muted">last check just now</p></div>`).join('');rows.innerHTML=(d.drivers||[]).map(t=>`<tr><td><b>${DU.esc(t.unit_number)}</b></td><td>${DU.esc(t.driver_name||'Unassigned')}</td><td>${DU.esc(t.samsara_vehicle_id||'not matched')}</td><td>${DU.esc(t.telegram_group_name||'not linked')}</td><td><span class="pill ${t.telegram_group_id?'lime':'red'}">${t.telegram_group_id?'ready':'needs link'}</span></td></tr>`).join('')}
poll(load,10000);
</script></body></html>
