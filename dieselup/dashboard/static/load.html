<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Load Detail</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="loads.html" data-title="Load Detail" data-sub="Assigned stop, actual fuel location, price and outcome"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div id="head"></div><div class="grid cols-2" style="margin-top:15px"><div class="card"><h3>Fuel recommendation</h3><div id="plan"></div></div><div class="card"><h3>Actual fueling</h3><div id="actual"></div></div></div>`;
const id=new URLSearchParams(location.search).get('id')||'14815';const label=e=>e.classification==='recommended'?'Followed recommendation':e.classification==='contracted_other'?'Wrong contracted stop':'Off-network / unknown';const price=e=>e.your_price==null?'price not matched':'$'+Number(e.your_price).toFixed(3)+'/gal';async function load(){const [loads,events]=await Promise.all([DU.req('/api/loads/pnl?period=year&limit=500'),DU.req('/api/fuel_events?limit=100')]);const row=(loads.loads||[]).find(x=>String(x.load_id)===String(id));const ev=events.find(x=>String(x.load_id)===String(id));document.querySelector('.head h1').textContent='Load '+DU.esc(id);head.innerHTML=row?`<div class="grid cols-4"><div class="card"><div class="eyebrow">Truck</div><div class="big">${DU.esc(row.truck_unit)}</div></div><div class="card"><div class="eyebrow">Saved</div><div class="big lime">${DU.money2(row.saved)}</div></div><div class="card"><div class="eyebrow">Loss</div><div class="big red">${DU.money2(row.loss)}</div></div><div class="card"><div class="eyebrow">Recoverable</div><div class="big amber">${DU.money2(row.recoverable)}</div></div></div>`:'<div class="card red">Load not found in P&L.</div>';plan.innerHTML=row?`<div class="big">${DU.esc(row.station_name||'--')}</div><p>${DU.esc([row.station_city,row.station_state].filter(Boolean).join(', '))}</p><p>${Number(row.planned_gallons||0).toFixed(0)} planned gallons · ${DU.esc(row.price_source||'price source')}</p>`:'--';actual.innerHTML=ev?`<div class="big ${ev.classification==='recommended'?'lime':'red'}">${DU.esc(label(ev))}</div><p>${DU.esc(ev.station_name||'Unknown')} · ${DU.esc([ev.station_address,ev.station_city,ev.station_state].filter(Boolean).join(', ')||'No address')}</p><p>${Number(ev.gallons||0).toFixed(0)} gal · ${DU.esc(price(ev))}</p>`:'<div class="empty">No actual fueling detected for this load yet.</div>'}
load();
</script></body></html>
