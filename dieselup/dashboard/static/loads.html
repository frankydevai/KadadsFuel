<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Loads · P&amp;L</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="loads.html" data-title="Loads · Fuel P&amp;L" data-sub="Per-load money, recommendation compliance, and actual fueling proof"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div class="filters" id="periods">${['today','week','month','year'].map(x=>`<button data-p="${x}" class="${x==='week'?'on':''}">${x}</button>`).join('')}</div><div class="grid cols-4" style="margin-top:18px" id="cards"></div><div class="section-title"><h2 id="loadsTitle">Weekly loads</h2><span>spend, saved, lost and recoverable by load</span></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Load</th><th>Truck</th><th>Status</th><th>Recommended stop</th><th>Fuel spend</th><th>Saved</th><th>Lost</th><th>Recoverable</th><th>Gallons</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
const badge=o=>`<span class="pill ${o==='saved'?'lime':o==='lost'?'red':o==='pending'?'amber':''}">${DU.esc(o||'open')}</span>`;
async function load(p='week'){loadsTitle.textContent=({today:'Daily loads',week:'Weekly loads',month:'Monthly loads',year:'Yearly loads'}[p]||'Loads');const [data,events]=await Promise.all([DU.req('/api/loads/pnl?period='+p+'&limit=200'),DU.req('/api/fuel_events?period='+p+'&limit=500')]);const s=data.summary||{};const spendByLoad={};events.forEach(e=>{if(!e.load_id)return;spendByLoad[e.load_id]=(spendByLoad[e.load_id]||0)+Number(e.gallons||0)*Number(e.your_price||e.actual_true_cost||0)});const spend=x=>Number(x.actual_spend||0)||Number(spendByLoad[x.load_id]||0);cards.innerHTML=`<div class="card"><div class="big">${DU.money2((data.loads||[]).reduce((a,x)=>a+spend(x),0))}</div>Fuel spend captured</div><div class="card"><div class="big lime">${DU.money2(s.saved)}</div>Verified saved</div><div class="card red"><div class="big red">${DU.money2(s.loss)}</div>Verified loss</div><div class="card amber"><div class="big amber">${DU.money2(s.recoverable)}</div>Recoverable open</div>`;rows.innerHTML=(data.loads||[]).map(x=>`<tr class="${x.outcome==='saved'?'row-followed':x.outcome==='lost'?'row-unfollowed':''}"><td><b>${DU.esc(x.load_id)}</b></td><td><a href="truck.html${PREVIEW?'?preview=1&id=':'?id='}${encodeURIComponent(x.truck_unit||'')}">${DU.esc(x.truck_unit||'--')}</a></td><td>${badge(x.outcome)}</td><td><b>${DU.esc(x.station_name||'--')}</b><br><small>${DU.esc([x.station_city,x.station_state].filter(Boolean).join(', ')||'')}</small></td><td>${spend(x)?DU.money2(spend(x)):'no fuel matched'}</td><td class="lime">${DU.money2(x.saved)}</td><td class="red">${DU.money2(x.loss)}</td><td class="amber">${DU.money2(x.recoverable)}</td><td>${Number(x.actual_gallons||x.planned_gallons||0).toFixed(0)}</td><td><a href="load.html${PREVIEW?'?preview=1&id=':'?id='}${encodeURIComponent(x.load_id||'')}">Audit</a></td></tr>`).join('')||'<tr><td colspan="10"><div class="empty">No load fuel events found for this period.</div></td></tr>'}
periods.onclick=e=>{if(e.target.dataset.p){periods.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===e.target));load(e.target.dataset.p).catch(err=>content.innerHTML=`<div class="card red">Could not load P&amp;L: ${DU.esc(err.message)}</div>`)}};
poll(()=>load(document.querySelector('#periods .on').dataset.p).catch(e=>content.innerHTML=`<div class="card red">Could not load P&amp;L: ${DU.esc(e.message)}</div>`),10000);
</script></body></html>
