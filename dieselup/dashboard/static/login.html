<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Kadads Fuel · Sign in</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body><main style="max-width:460px;margin:9vh auto"><div class="brand"><div class="mark">K</div><div><b>Kadads Fuel</b><small>Dispatch Command</small></div></div><form class="card" id="form"><h1>Welcome back</h1><p class="muted">Sign in to Kadads live fuel command.</p><label>Email<input name="email" type="email" required style="width:100%;margin:6px 0 14px;padding:11px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px"></label><label>Password<input name="password" type="password" required style="width:100%;margin:6px 0 18px;padding:11px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px"></label><button class="btn primary" style="width:100%">Sign in</button><p id="err" class="red"></p></form></main><script>form.onsubmit=async e=>{e.preventDefault();err.textContent='';const v=Object.fromEntries(new FormData(form));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});const b=await r.json();if(!r.ok){err.textContent=b.detail;return}localStorage.setItem('du_token','cookie');localStorage.setItem('du_user',JSON.stringify({role:'superadmin',name:'Kadads Dispatch',default_view:'ops'}));location.href='/index.html'}</script></body></html>
