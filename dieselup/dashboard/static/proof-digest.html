<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Proof Digest</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="proof-digest.html" data-title="Monthly Proof Digest" data-sub="Every verified dollar tied to evidence"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div class="grid cols-3"><div class="card"><div class="eyebrow">Verified</div><div class="big lime" id="verified">$0</div></div><div class="card amber"><div class="eyebrow">Recoverable</div><div class="big amber" id="recoverable">$0</div></div><div class="card"><div class="eyebrow">Fuel proofs</div><div class="big" id="proofs">0</div></div></div><div class="section-title"><h2>Receipt and fuel proof queue</h2><span>matched by truck + date + gallons</span></div><div class="card"><table><thead><tr><th>Truck</th><th>Load</th><th>Station</th><th>Price</th><th>Gallons</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card" style="margin-top:15px;text-align:center;border-style:dashed"><h3>Drop receipts here</h3><p class="muted">PDF, JPG, PNG or XLSX. Preview keeps files local.</p><input id="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx"><p id="fileMsg" class="muted"></p></div>`;
async function load(){const [s,f]=await Promise.all([DU.req('/api/savings?period=month'),DU.req('/api/fuel_events?limit=100')]);verified.textContent=DU.money2(s.verified_saved);recoverable.textContent=DU.money2(s.capturable);proofs.textContent=f.length;rows.innerHTML=f.map(e=>`<tr><td>${DU.esc(e.truck_unit)}</td><td>${DU.esc(e.load_id||'--')}</td><td>${DU.esc(e.station_name||'Unknown')}</td><td>${e.your_price==null?'not matched':'$'+Number(e.your_price).toFixed(3)}</td><td>${Number(e.gallons||0).toFixed(0)}</td><td><span class="pill ${e.classification==='recommended'?'lime':'amber'}">${DU.esc(e.classification)}</span></td></tr>`).join('')}
files.onchange=async()=>{const fd=new FormData();[...files.files].forEach(f=>fd.append('files',f));const r=await DU.req('/api/receipts/upload',{method:'POST',body:fd,headers:{}});fileMsg.textContent=(r.count||files.files.length||0)+' receipt file(s) queued for re-audit. '+(r.message||'')};load();
</script></body></html>
