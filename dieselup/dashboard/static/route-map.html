<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Route Map</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="route-map.html" data-title="Truck Route Map" data-sub="Type a truck number to see planned fuel stops on that truck's current load"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div class="card"><input id="unit" placeholder="Truck number" style="padding:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px"><button id="build" class="btn primary">Show route</button><span id="state" class="pill lime">ready</span></div><div class="grid cols-2" style="margin-top:15px"><div class="card"><svg id="route" viewBox="0 0 900 430" style="width:100%;min-height:430px"></svg></div><div class="card"><h3>Planned fuel stops</h3><div id="decision"></div><div class="section-title"><h2>All candidates</h2><span>from bot recommendation</span></div><div id="candidates" class="quick-list"></div><div class="section-title"><h2>Actual fueling</h2><span>followed or not</span></div><div id="actual" class="quick-list"></div></div></div>`;
const params=new URLSearchParams(location.search);unit.value=params.get('truck')||params.get('id')||'';
const n=v=>Number(v||0);const price=s=>s.your_price==null?'price not matched':'$'+Number(s.your_price).toFixed(3)+'/gal';
function pt(i,total){const x=120+(i*Math.max(1,660/Math.max(1,total-1)));const y=340-(i%5)*52;return [x,y]}
function candidateName(c){return c.station_name||c.name||c.stop_name||'Fuel stop'}
async function load(){const u=unit.value.trim();if(!u){state.textContent='type truck #';return}state.textContent='loading';const d=await DU.req('/api/truck/'+encodeURIComponent(u)+'/route');const c=(d.candidates||[]);const ev=(d.events||[])[0];const actuals=(d.fuel_events||[]);const truck=d.truck||{};const valid=c.filter(x=>Number(x.miles_to_stop??x.miles_ahead??x.distance_miles??0)>=0||!('miles_to_stop'in x));const best=valid[0]||c[0];state.textContent=(best?'route loaded':'no active fuel plan');route.innerHTML=`<rect width="900" height="430" rx="18" fill="#08100c" stroke="#202a23"/><polyline points="85,350 210,305 355,268 520,220 675,162 815,102" fill="none" stroke="#54e875" stroke-width="7" stroke-linecap="round"/><rect x="92" y="326" width="48" height="32" rx="8" fill="#172318" stroke="#54e875"/><text x="150" y="347" fill="#f4f8f5">Truck ${DU.esc(u)} · ${Math.round(n(truck.fuel_pct))}%</text>${c.slice(0,8).map((s,i)=>{const p=pt(i,c.length);const isBest=s===best;return `<g><circle cx="${p[0]}" cy="${p[1]}" r="${isBest?18:13}" fill="${isBest?'#54e875':'#f3b65e'}"/><text x="${p[0]+24}" y="${p[1]-4}" fill="#f4f8f5">${DU.esc(candidateName(s))}</text><text x="${p[0]+24}" y="${p[1]+14}" fill="#849087">${DU.esc(price(s))}</text></g>`}).join('')}${actuals.slice(0,5).map((e,i)=>{const p=pt(i+1,Math.max(c.length,3));return `<g><circle cx="${p[0]}" cy="${p[1]-34}" r="12" fill="${e.classification==='recommended'?'#54e875':'#f2645a'}"/><text x="${p[0]+18}" y="${p[1]-30}" fill="#f4f8f5">Fueled: ${DU.esc(e.station_name||'unknown')}</text></g>`}).join('')}`;decision.innerHTML=best?`<div class="big lime">${DU.esc(candidateName(best))}</div><p>${DU.esc([best.address,best.city,best.state].filter(Boolean).join(', ')||'No full address')}</p><p>${DU.esc(price(best))} · load ${DU.esc(best.load_id||ev?.load_id||'--')}</p>`:'<div class="empty">No current planned stop found for this truck.</div>';candidates.innerHTML=c.map(s=>`<button class="btn"><b>${DU.esc(candidateName(s))}</b><br><span class="muted">${DU.esc([s.address,s.city,s.state].filter(Boolean).join(', ')||'No address')}</span><br><span class="lime">${DU.esc(price(s))}</span></button>`).join('')||'<div class="empty">No candidate stops stored.</div>';actual.innerHTML=actuals.map(e=>`<a class="move" href="truck.html${PREVIEW?'?preview=1&id=':'?id='}${encodeURIComponent(u)}"><b>${DU.esc(e.load_id||'--')}</b><span><strong>${DU.esc(e.station_name||'Unknown')}</strong><small>${DU.esc([e.station_address,e.station_city,e.station_state].filter(Boolean).join(', ')||'No address')}</small></span><i class="${e.classification==='recommended'?'lime':'red'}">${DU.esc(e.classification)}</i></a>`).join('')||'<div class="empty">No actual fueling detected.</div>'}
build.onclick=load;if(unit.value)load();
</script></body></html>
