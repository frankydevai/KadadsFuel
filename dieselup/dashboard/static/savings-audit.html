<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Savings Audit</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="savings-audit.html" data-title="Savings Audit" data-sub="Read-only leakage report from actual fuel behavior"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div class="grid cols-3"><div class="card red"><div class="eyebrow">Verified loss</div><div class="big red" id="loss">$0</div></div><div class="card amber"><div class="eyebrow">Recoverable</div><div class="big amber" id="rec">$0</div></div><div class="card"><div class="eyebrow">Wrong/off-network fills</div><div class="big" id="bad">0</div></div></div><div class="grid cols-2" style="margin-top:15px"><div class="card"><h3>Leak breakdown</h3><div id="leaks"></div></div><div class="card"><h3>Projected recoverable</h3><div class="big lime" id="projected">$0</div><p class="muted">If current pending plans are followed.</p><button class="btn primary">Download PDF</button></div></div>`;
async function load(){const [s,f]=await Promise.all([DU.req('/api/savings?period=month'),DU.req('/api/fuel_events?limit=100')]);const wrong=f.filter(e=>e.classification!=='recommended');loss.textContent=DU.money2(s.lost);rec.textContent=DU.money2(s.capturable);projected.textContent=DU.money2(s.capturable);bad.textContent=wrong.length;leaks.innerHTML=wrong.map(e=>`<div class="move"><b class="red">${DU.esc(e.truck_unit)}</b><span><strong>${DU.esc(e.station_name||'Unknown')}</strong><small>${DU.esc(e.classification)} · ${e.your_price==null?'price not matched':'$'+Number(e.your_price).toFixed(3)+'/gal'}</small></span><i>${Number(e.gallons||0).toFixed(0)} gal</i></div>`).join('')||'<div class="empty">No leakage found.</div>'}
load();
</script></body></html>
