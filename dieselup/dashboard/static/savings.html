<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Savings</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="savings.html" data-title="Savings" data-sub="Money, active fueling, and follow/not-follow status"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div class="filters" id="periods">${['today','week','month','year'].map(x=>`<button data-p="${x}" class="${x==='month'?'on':''}">${x}</button>`).join('')}</div><div class="grid cols-4" style="margin-top:18px" id="cards"></div><div class="grid cols-2" style="margin-top:15px"><div class="card"><div class="section-title" style="margin-top:0"><h2>Where trucks are fueling now</h2><span>actual fuel events</span></div><div id="fueling" class="quick-list"></div></div><div class="card"><div class="section-title" style="margin-top:0"><h2>Savings / losses by load</h2><span>spend per load</span></div><div id="loads" class="quick-list"></div></div></div><div class="section-title"><h2>Fuel proof audit</h2><span>where we saved and lost</span></div><div class="card"><table><thead><tr><th>Truck</th><th>Load</th><th>Followed?</th><th>Actual fueling stop</th><th>Price</th><th>Gallons</th></tr></thead><tbody id="proofRows"></tbody></table></div>`;
const label=e=>e.classification==='recommended'?'followed':e.classification==='contracted_other'?'wrong contracted stop':'off-network / unknown';
const price=e=>e.your_price==null?'not matched':'$'+Number(e.your_price).toFixed(3)+'/gal';
async function load(p='month'){const [v,pnl,events]=await Promise.all([DU.req('/api/savings?period='+p),DU.req('/api/loads/pnl?period='+p+'&limit=50'),DU.req('/api/fuel_events?period='+p+'&limit=200')]);const spendByLoad={};events.forEach(e=>{if(!e.load_id)return;spendByLoad[e.load_id]=(spendByLoad[e.load_id]||0)+Number(e.gallons||0)*Number(e.your_price||e.actual_true_cost||0)});const spend=x=>Number(x.actual_spend||0)||Number(spendByLoad[x.load_id]||0);cards.innerHTML=`<div class="card"><div class="eyebrow">Verified saved · ${DU.esc(p)}</div><div class="big lime">${DU.money2(v.verified_saved)}</div><p class="muted">${v.fills||0} fuel proofs</p></div><div class="card amber"><div class="eyebrow">Still recoverable · ${DU.esc(p)}</div><div class="big amber">${DU.money2(v.capturable)}</div><p class="muted">Pending plans drivers can still follow</p></div><div class="card red"><div class="eyebrow">Verified loss · ${DU.esc(p)}</div><div class="big red">${DU.money2(v.lost)}</div><p class="muted">Wrong stop or missed stop</p></div><div class="card"><div class="eyebrow">Actual spend captured · ${DU.esc(p)}</div><div class="big">${DU.money2(events.reduce((a,e)=>a+Number(e.gallons||0)*Number(e.your_price||e.actual_true_cost||0),0))}</div><p class="muted">from matched fuel events</p></div>`;fueling.innerHTML=events.slice(0,8).map(e=>`<a class="move ${e.classification==='recommended'?'followed':'unfollowed'}" href="truck.html${PREVIEW?'?preview=1&id=':'?id='}${encodeURIComponent(e.truck_unit||'')}"><b>${DU.esc(e.truck_unit)}</b><span><strong>${DU.esc(e.station_name||'Unknown')}</strong><small>${DU.esc([e.station_address,e.station_city,e.station_state].filter(Boolean).join(', ')||'No address')} · ${DU.esc(label(e))}</small></span><i>${DU.esc(price(e))}</i></a>`).join('')||'<div class="empty">No fueling events for this period.</div>';loads.innerHTML=(pnl.loads||[]).slice(0,8).map(x=>`<a class="move ${(x.outcome==='saved'||spend(x)>0)&&x.outcome!=='lost'?'followed':x.outcome==='lost'?'unfollowed':''}" href="load.html${PREVIEW?'?preview=1&id=':'?id='}${encodeURIComponent(x.load_id||'')}"><b>${DU.esc(x.load_id)}</b><span><strong>Truck ${DU.esc(x.truck_unit||'--')}</strong><small>Spent ${spend(x)?DU.money2(spend(x)):'no actual fuel matched'} · ${Number(x.actual_gallons||x.planned_gallons||0).toFixed(0)} gal</small></span><i class="${Number(x.loss||0)>0?'red':'lime'}">${DU.money2(Number(x.saved||0)-Number(x.loss||0))}</i></a>`).join('')||'<div class="empty">No load P&L for this period.</div>';const followed=events.filter(e=>e.classification==='recommended'),unfollowed=events.filter(e=>e.classification!=='recommended');proofRows.innerHTML=[...followed,...unfollowed].map(e=>`<tr class="${e.classification==='recommended'?'row-followed':'row-unfollowed'}"><td>${DU.esc(e.truck_unit)}</td><td>${DU.esc(e.load_id||'--')}</td><td><span class="pill ${e.classification==='recommended'?'lime':'red'}">${DU.esc(label(e))}</span></td><td>${DU.esc(e.station_name||'Unknown')}<br><small class="muted">${DU.esc([e.station_address,e.station_city,e.station_state].filter(Boolean).join(', ')||'No address')}</small></td><td>${DU.esc(price(e))}</td><td>${Number(e.gallons||0).toFixed(0)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No fuel proof rows for this period.</td></tr>'}
periods.onclick=e=>{if(e.target.dataset.p){periods.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===e.target));load(e.target.dataset.p)}};poll(()=>load(document.querySelector('#periods .on').dataset.p),10000)
</script></body></html>
