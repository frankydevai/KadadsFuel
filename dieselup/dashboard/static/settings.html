<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Settings</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="settings.html" data-title="Settings" data-sub="Fuel logic rules, alert thresholds and price freshness"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div class="grid cols-3" id="ruleCards"></div><form class="card" id="settingsForm" style="margin-top:15px"><div class="grid cols-2">${[['reserve_pct','Reserve %'],['min_fill_gallons','Minimum fill gallons'],['critical_fuel_pct','Critical fuel %'],['miss_distance_miles','Miss distance miles'],['reminder_distance_miles','Reminder distance'],['home_ifta_state','Home IFTA state'],['price_source','Price source']].map(x=>`<label class="field">${x[1]}<input name="${x[0]}"></label>`).join('')}</div><div id="save" style="margin-top:18px"></div></form><div class="section-title"><h2>Current protections</h2><span>what the bot should enforce</span></div><div class="grid cols-2"><div class="card"><h3>Driver alert rules</h3><ul class="done-list"><li>No alert when truck has enough fuel</li><li>No stop behind truck</li><li>Replan after passed stop</li><li>Warn if prices older than 24 hours</li></ul></div><div class="card"><h3>California rule</h3><p class="muted">Avoid buying in California. Fill before the state line and remind dispatch while approaching.</p></div></div>`;
save.innerHTML=actions(`<button class="btn primary">Save settings</button> <span id="savedMsg" class="muted"></span>`);
function drawCards(v){ruleCards.innerHTML=[['Reserve',v.reserve_pct+'%'],['Minimum fill',v.min_fill_gallons+' gal'],['Critical fuel',v.critical_fuel_pct+'%']].map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><div class="big lime">${x[1]}</div></div>`).join('')}
DU.req('/api/settings').then(v=>{drawCards(v);Object.entries(v).forEach(([k,val])=>{if(settingsForm.elements[k])settingsForm.elements[k].value=Array.isArray(val)?val.join(', '):val})});
settingsForm.onsubmit=async e=>{e.preventDefault();if(DU.user().role==='member')return;const body=Object.fromEntries(new FormData(settingsForm));await DU.req('/api/settings',{method:'PUT',body:JSON.stringify(body)});drawCards(body);savedMsg.textContent='Saved locally / queued for API'};
</script></body></html>
