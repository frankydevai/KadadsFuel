<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Team</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="team.html" data-title="Team" data-sub="Roles, bot health and admin audit trail"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div class="grid cols-3"><div class="card"><div class="eyebrow">Owner</div><div class="big">Admin</div><p class="muted">full dashboard access</p></div><div class="card"><div class="eyebrow">Dispatchers</div><div class="big lime">3</div><p class="muted">can link trucks and approve sends</p></div><div class="card"><div class="eyebrow">Members</div><div class="big">6</div><p class="muted">read-only operations view</p></div></div><div class="section-title"><h2>Bot health</h2><span>driver groups stay quiet unless needed</span></div><div class="grid cols-3" id="health"></div><div class="section-title"><h2>Audit log</h2><span>last actions</span></div><div class="card"><table><tbody id="audit"></tbody></table></div>`;
async function load(){const [h,f,l]=await Promise.all([DU.req('/health'),DU.req('/api/fuel_events?limit=8'),DU.req('/api/loads/pnl?limit=8')]);health.innerHTML=Object.entries(h.detail||{}).map(([k,v])=>`<div class="card"><div class="big lime">${DU.esc(typeof v==='object'?JSON.stringify(v):v)}</div>${DU.esc(k)}</div>`).join('');const rows=[...(f||[]).map(e=>[`Fuel event: truck ${e.truck_unit} ${e.classification} at ${e.station_name||'unknown'}`,e.detected_at||'live DB']),...((l.loads||[]).map(x=>[`Load ${x.load_id}: truck ${x.truck_unit} ${x.outcome||'open'} net ${DU.money2(Number(x.saved||0)-Number(x.loss||0))}`,x.price_date||'live DB']))];audit.innerHTML=rows.map(([text,at])=>`<tr><td>${DU.esc(text)}</td><td class="muted">${DU.esc(at)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No live audit rows yet.</td></tr>'}
load();
</script></body></html>
