<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Truck Detail</title><link rel="stylesheet" href="app.css?v=20261002-advice"></head><body data-page="drivers.html" data-title="Truck Detail" data-sub="Truck status, recommendation, fueling proof and price"><script src="app.js?v=20261002-advice"></script><script>
shell();content.innerHTML=`<div id="actions"></div><div class="grid cols-4"><div class="card"><div class="eyebrow">Fuel</div><div class="big" id="fuel">--%</div></div><div class="card"><div class="eyebrow">Speed</div><div class="big" id="speed">--</div></div><div class="card"><div class="eyebrow">Driver group</div><div class="big" id="group">--</div></div><div class="card"><div class="eyebrow">Assigned stop</div><div class="big" id="stop">--</div></div></div><div class="grid cols-2" style="margin-top:15px"><div class="card"><h3>Latest fueling proof</h3><div id="proof"></div></div><div class="card"><h3>Load money</h3><div id="money"></div></div></div><div class="section-title"><h2>Fueling history</h2><span>actual station and price</span></div><div class="card"><table><thead><tr><th>Load</th><th>Result</th><th>Where fueled</th><th>Price</th><th>Gallons</th></tr></thead><tbody id="rows"></tbody></table></div>`;
const unit=new URLSearchParams(location.search).get('id')||'3284';const label=e=>e.classification==='recommended'?'Followed recommendation':e.classification==='contracted_other'?'Wrong contracted stop':'Off-network / unknown';const price=e=>e.your_price==null?'price not matched':'$'+Number(e.your_price).toFixed(3)+'/gal';async function load(){const [d,f,l]=await Promise.all([DU.req('/api/drivers'),DU.req('/api/fuel_events?limit=100'),DU.req('/api/loads/pnl?period=year&limit=500')]);const t=(d.drivers||[]).find(x=>String(x.unit_number)===String(unit));const events=f.filter(e=>String(e.truck_unit)===String(unit));const ev=events[0];const loadRow=(l.loads||[]).find(x=>String(x.truck_unit)===String(unit));document.querySelector('.head h1').textContent='Truck '+DU.esc(unit);actions.innerHTML=`<a class="btn primary" href="route-map.html${PREVIEW?'?preview=1&truck=':'?truck='}${encodeURIComponent(unit)}">Route</a> <a class="btn" href="fuel-map.html${PREVIEW?'?preview=1':''}">Fuel map</a> <a class="btn" href="fuel-history${PREVIEW?'?preview=1&truck=':'?truck='}${encodeURIComponent(unit)}">Advice history</a>`;fuel.textContent=Math.round(t?.fuel_pct??ev?.fuel_pct_end??0)+'%';fuel.className=(t?.fuel_pct??100)<25?'big red':'big lime';speed.textContent=Math.round(t?.speed_mph||0)+' mph';group.textContent=t?.telegram_group_id?'linked':'not linked';group.className=t?.telegram_group_id?'big lime':'big red';stop.textContent=t?.stop_name||loadRow?.station_name||'--';proof.innerHTML=ev?`<div class="big ${ev.classification==='recommended'?'lime':'red'}">${DU.esc(label(ev))}</div><p>${DU.esc(ev.station_name||'Unknown')} · ${DU.esc([ev.station_address,ev.station_city,ev.station_state].filter(Boolean).join(', ')||'No address')}</p><p>${Number(ev.gallons||0).toFixed(0)} gal · ${price(ev)} · ${Math.round(ev.fuel_pct_start||0)}% to ${Math.round(ev.fuel_pct_end||0)}%</p>`:'<div class="empty">No fueling detected for this truck.</div>';money.innerHTML=loadRow?`<div class="big">Load ${DU.esc(loadRow.load_id)}</div><p>Saved ${DU.money2(loadRow.saved)} · Loss ${DU.money2(loadRow.loss)} · Recoverable ${DU.money2(loadRow.recoverable)}</p>`:'<div class="empty">No load money row matched.</div>';rows.innerHTML=events.map(e=>`<tr><td>${DU.esc(e.load_id||'--')}</td><td>${DU.esc(label(e))}</td><td>${DU.esc(e.station_name||'Unknown')}<br><span class="muted">${DU.esc([e.station_address,e.station_city,e.station_state].filter(Boolean).join(', ')||'No address')}</span></td><td>${DU.esc(price(e))}</td><td>${Number(e.gallons||0).toFixed(0)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No fueling history.</td></tr>'}
load();
</script></body></html>
